name: Release

# Two steps, with a pull request between them. CONTRIBUTING.md ("Release a version") has the steps
# and the one-time setup.
#
# 1. A manual run (Actions > Release > Run workflow) with `patch` (the default), `minor`, `major` or
#    an exact version X.Y.Z opens the pull request "Release vX.Y.Z". It sets the version in pom.xml
#    and the README install snippet, and dates the [Unreleased] section of the CHANGELOG
#    (`java scripts/Release.java prepare`). A pull request that GITHUB_TOKEN opens starts no
#    workflow, so the run starts ci.yml on the release branch itself.
# 2. The merge of that pull request into main publishes the version: when the version of pom.xml
#    has no tag and the CHANGELOG has its dated section (`java scripts/Release.java status`), the
#    run waits for the ci.yml run of the merge commit, publishes the SDK to Maven Central, and then
#    creates the tag vX.Y.Z and its GitHub release. A failed step publishes nothing after it; the tag
#    comes last, so a re-run of the failed jobs continues the release.
#
# Maven Central has no trusted publishing (OIDC). The closest match: this job's OIDC token assumes
# an AWS role that trusts only the `release` environment of this repository, and that role reads
# the Central user token and the GPG signing key from AWS Secrets Manager. GitHub stores no
# long-lived publishing secret.
on:
  workflow_dispatch:
    inputs:
      version:
        description: patch, minor, major, or an exact version X.Y.Z
        required: true
        default: patch
        type: string
  push:
    branches: [main]
    paths:
      - pom.xml
      - CHANGELOG.md

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GROUP_PATH: com/agentcat/agentcat-java-sdk
  AWS_REGION: us-east-1

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: The run is on main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow on main, not on $GITHUB_REF_NAME"
          exit 1
      # The full history holds the tags that the next version counts from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set the version and date the CHANGELOG
        id: prepare
        env:
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$(java scripts/Release.java prepare "$INPUT" "$(date -u +%F)")"
          # Maven Central never accepts a version twice.
          if curl -sSf "https://repo1.maven.org/maven2/$GROUP_PATH/maven-metadata.xml" 2>/dev/null \
              | grep -q "<version>$version</version>"; then
            echo "::error::Maven Central already has agentcat-java-sdk $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add pom.xml README.md CHANGELOG.md
          git commit -m "Release v$VERSION"
          git push origin "$branch"
          java scripts/Release.java notes "$VERSION" > notes.md
          {
            echo "Merging this pull request publishes \`com.agentcat:agentcat-java-sdk\` $VERSION to Maven Central, then tags \`v$VERSION\` and creates its GitHub release with these notes:"
            echo
            cat notes.md
          } > body.md
          gh pr create --base main --head "$branch" --title "Release v$VERSION" --body-file body.md
          gh workflow run ci.yml --ref "$branch"

  status:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.status.outputs.version }}
      publish: ${{ steps.status.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Is this version released?
        id: status
        run: |
          set -euo pipefail
          read -r version action <<<"$(java scripts/Release.java status)"
          echo "agentcat-java-sdk $version: $action"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$action" = publish ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: status
    if: needs.status.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # The AWS role that holds the Central credentials trusts only this environment.
    environment:
      name: release
      url: https://central.sonatype.com/artifact/com.agentcat/agentcat-java-sdk/${{ needs.status.outputs.version }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      # The CI run of this push to main checks the commit on every Java and MCP version; the SDK
      # goes out only when it passes.
      - name: Wait for CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 85); do
            read -r status conclusion <<<"$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push" \
              --jq '.workflow_runs | sort_by(.run_attempt) | last | "\(.status // "none") \(.conclusion // "none")"')"
            if [ "$status" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI passed on $GITHUB_SHA"
                exit 0
              fi
              echo "::error::CI on $GITHUB_SHA ended with $conclusion; re-run CI, then re-run this job"
              exit 1
            fi
            sleep 60
          done
          echo "::error::CI on $GITHUB_SHA did not finish in time"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # settings.xml names the server "central" and reads the token from the two environment
      # variables of the deploy step; the file itself holds no secret.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
      # central-publishing-maven-plugin does not work with Maven 4.
      - name: Maven is 3.x
        run: |
          set -euo pipefail
          mvn -v | head -1
          mvn -v | head -1 | grep -q 'Apache Maven 3\.' || { echo "::error::the Central plugin needs Maven 3"; exit 1; }
      - name: Assume the release role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          role-session-name: agentcat-java-sdk-release-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
      # The credentials stay in shell variables of this one step: never step outputs or files.
      # A re-run after a publish that went through skips the publish.
      - name: Publish to Maven Central
        id: publish
        run: |
          set -euo pipefail
          central="$(aws secretsmanager get-secret-value --secret-id mcpcat/maven-central-token --query SecretString --output text)"
          MAVEN_CENTRAL_USERNAME="$(jq -r '.MAVEN_CENTRAL_USERNAME' <<<"$central")"
          MAVEN_CENTRAL_PASSWORD="$(jq -r '.MAVEN_CENTRAL_PASSWORD' <<<"$central")"
          echo "::add-mask::$MAVEN_CENTRAL_USERNAME"
          echo "::add-mask::$MAVEN_CENTRAL_PASSWORD"
          export MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD

          bearer="$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)"
          echo "::add-mask::$bearer"
          published="$(curl -sSf -H "Authorization: Bearer $bearer" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=com.agentcat&name=agentcat-java-sdk&version=$VERSION" \
            | jq -r '.published')"
          if [ "$published" = true ]; then
            echo "Maven Central already has agentcat-java-sdk $VERSION"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gpg_secret="$(aws secretsmanager get-secret-value --secret-id mcpcat/maven-gpg-key --query SecretString --output text)"
          MAVEN_GPG_PASSPHRASE="$(jq -r '.GPG_PASSPHRASE' <<<"$gpg_secret")"
          echo "::add-mask::$MAVEN_GPG_PASSPHRASE"
          export MAVEN_GPG_PASSPHRASE
          jq -r '.GPG_PRIVATE_KEY' <<<"$gpg_secret" | gpg --batch --import
          unset gpg_secret central

          # Name mcp-2.0.1 too: an explicit -P turns off the activeByDefault profile.
          mvn --batch-mode --no-transfer-progress deploy -P release,mcp-2.0.1 -DskipTests
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      # A signed statement of the commit and the workflow that built these jars, through the same
      # OIDC token (Sigstore). `gh attestation verify <jar> -R agentcathq/agentcat-java-sdk` checks it.
      - name: Attest the build provenance
        if: steps.publish.outputs.deployed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/agentcat-java-sdk-${{ env.VERSION }}*.jar

  github-release:
    needs: [status, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.status.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Tag the commit and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          java scripts/Release.java notes "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --notes-file notes.md
