
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

  compat:
    name: MCP ${{ matrix.mcp-profile }} / Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    needs: test

    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21', '25']
        mcp-profile:
          - mcp-1x
          - mcp-018x

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Compile production sources (MCP 2.x)
        run: mvn --batch-mode --no-transfer-progress clean compile

      - name: Run compat tests
        run: mvn --batch-mode --no-transfer-progress test -P${{ matrix.mcp-profile }}